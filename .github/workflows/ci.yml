name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Strictly isolated mock database — zero production credentials in CI
      DATABASE_URL: postgresql://mock:mock@localhost:5432/mock?sslmode=disable
      AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Block known stray files
        run: |
          # components/cms/route.ts: stray draft file that keeps reappearing
          # data/projects.ts: hardcoded projects data was removed (projects live in the DB)
          for f in components/cms/route.ts data/projects.ts; do
            if [ -e "$f" ]; then
              echo "::error file=$f::Forbidden file present: $f - delete it."
              exit 1
            fi
          done

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Run sanitization security test suite
        run: npx tsx scripts/test-sanitization.ts

      - name: Drizzle schema vs migration sync check (Advisory)
        continue-on-error: true
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::warning::Uncommitted schema changes detected in Drizzle migrations! Run 'npm run db:generate' locally."
            git status --porcelain db/migrations
            exit 1
          fi

      - name: Build Next.js application
        run: npm run build
