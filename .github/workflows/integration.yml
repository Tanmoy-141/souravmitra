name: Integration Tests

on:
  workflow_dispatch:
  # Runs on main too, so the production migration workflow can verify
  # that integration tests passed on the exact commit being migrated.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shared-neon-test-database
  cancel-in-progress: false

jobs:
  check-environment:
    name: Check Test Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_secret: ${{ steps.check.outputs.has_secret }}
    steps:
      - name: Inspect TEST_DATABASE_URL secret
        id: check
        env:
          TEST_DB: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -n "$TEST_DB" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
            echo "TEST_DATABASE_URL secret is configured. Proceeding to E2E integration test suite."
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration Tests Unavailable::TEST_DATABASE_URL is not accessible in this context (${{ github.event_name }} from '${{ github.actor }}'). The HTTP & Concurrency E2E Test Suite job will be skipped."
            echo "### ⚠️ Integration Tests Not Run" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The \`TEST_DATABASE_URL\` secret is unavailable in this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Trigger**: \`${{ github.event_name }}\` by \`${{ github.actor }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Context**: Dependabot PRs, fork PRs, or runs without repository secrets cannot access the test database." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status**: The \`HTTP & Concurrency E2E Test Suite\` job was skipped. Note that production migration checks enforce that this job completed with **success**, so skipped runs cannot be migrated." >> "$GITHUB_STEP_SUMMARY"
          fi

  integration:
    name: HTTP & Concurrency E2E Test Suite
    needs: check-environment
    if: needs.check-environment.outputs.has_secret == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # IMPORTANT: TEST_DATABASE_URL must point at a dedicated Neon test branch or
    # project, never production. The test suite writes likes, views and comments.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Apply the PR's migrations to the test database so tests run against the
      # schema in this commit. The test DB is throwaway; production is untouched.
      - name: Migrate test database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm run db:migrate

      - name: Run HTTP & DB interactions E2E test suite
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          # Fixed test-only value. Never reuse the production AUTH_SECRET in CI.
          AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npx tsx scripts/test-interactions-e2e.ts
