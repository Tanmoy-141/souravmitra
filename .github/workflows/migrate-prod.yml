name: Production Database Migration

# Manual only. Before running:
#  - Use Neon's DIRECT (non-pooled) connection string for the DATABASE_URL secret;
#    DDL through a pooler can misbehave.
#  - Take a Neon restore point / backup branch first if any pending migration
#    modifies or deletes data (e.g. 0005 deletes duplicate project_views rows).

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Target Commit SHA to migrate (leave blank to default to latest origin/main)"
        required: false
        type: string
      confirm:
        description: 'Type "APPLY" to confirm running migrations against production database'
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Never run two production migrations at once.
concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  verify-target:
    name: Verify Commit & CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.resolve-sha.outputs.sha }}

    steps:
      - name: Validate confirmation string
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "APPLY" ]; then
            echo "::error::Migration cancelled: Confirmation input was not 'APPLY'."
            exit 1
          fi

      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate target commit
        id: resolve-sha
        env:
          SHA_INPUT: ${{ inputs.commit_sha }}
        run: |
          if [ -n "$SHA_INPUT" ]; then
            TARGET_SHA="$SHA_INPUT"
          else
            # Authoritatively resolve the current commit of origin/main
            TARGET_SHA=$(git rev-parse origin/main)
          fi

          # 1. Enforce strict 40-character hexadecimal SHA format
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA format: '$TARGET_SHA'. Must be a full 40-character hexadecimal SHA."
            exit 1
          fi

          # 2. Verify reachability from origin/main
          echo "Validating that commit $TARGET_SHA is reachable from origin/main..."
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::Target commit $TARGET_SHA is not reachable from origin/main!"
            exit 1
          fi

          echo "Target commit confirmed: $TARGET_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify required workflows passed on target commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.resolve-sha.outputs.sha }}
        run: |
          echo "Verifying CI and Integration test runs for target commit: $TARGET_SHA"

          # -----------------------------------------------------------------
          # 1. VERIFY CI WORKFLOW
          # -----------------------------------------------------------------
          echo "Querying 'CI' workflow runs for commit $TARGET_SHA..."
          CI_RUNS=$(gh run list --commit "$TARGET_SHA" --workflow "CI" --json databaseId,status,conclusion,createdAt --jq '.')

          if [ -z "$CI_RUNS" ] || [ "$CI_RUNS" = "[]" ]; then
            echo "::error::No 'CI' workflow runs found for commit $TARGET_SHA. Cannot migrate untested code."
            exit 1
          fi

          CI_IN_PROGRESS=$(echo "$CI_RUNS" | jq '[.[] | select(.status != "completed")] | length')
          if [ "$CI_IN_PROGRESS" -gt 0 ]; then
            echo "::error::'CI' workflow is currently in progress for commit $TARGET_SHA. Wait for all CI runs to complete."
            exit 1
          fi

          # Pick the latest run (prevent older successes from masking newer failures)
          LATEST_CI_RUN=$(echo "$CI_RUNS" | jq 'sort_by(.createdAt) | reverse | .[0]')
          CI_RUN_ID=$(echo "$LATEST_CI_RUN" | jq -r '.databaseId')
          CI_STATUS=$(echo "$LATEST_CI_RUN" | jq -r '.status')
          CI_CONCLUSION=$(echo "$LATEST_CI_RUN" | jq -r '.conclusion')

          if [ "$CI_STATUS" != "completed" ] || [ "$CI_CONCLUSION" != "success" ]; then
            echo "::error::Latest 'CI' workflow run (ID: $CI_RUN_ID) did not succeed (status: $CI_STATUS, conclusion: $CI_CONCLUSION)."
            exit 1
          fi

          CI_JOBS=$(gh run view "$CI_RUN_ID" --json jobs --jq '.jobs')
          CI_BUILD_JOB=$(echo "$CI_JOBS" | jq '.[] | select(.name == "Lint, Typecheck, Tests & Build")')
          CI_BUILD_CONCLUSION=$(echo "$CI_BUILD_JOB" | jq -r '.conclusion')
          if [ "$CI_BUILD_CONCLUSION" != "success" ]; then
            echo "::error::'Lint, Typecheck, Tests & Build' job in CI run $CI_RUN_ID concluded with '$CI_BUILD_CONCLUSION'."
            exit 1
          fi
          echo "Verified: 'CI' workflow passed on commit $TARGET_SHA (run ID: $CI_RUN_ID)."

          # -----------------------------------------------------------------
          # 2. VERIFY INTEGRATION TESTS & SPECIFIC E2E JOB
          # -----------------------------------------------------------------
          echo "Querying 'Integration Tests' workflow runs for commit $TARGET_SHA..."
          INT_RUNS=$(gh run list --commit "$TARGET_SHA" --workflow "Integration Tests" --json databaseId,status,conclusion,createdAt --jq '.')

          if [ -z "$INT_RUNS" ] || [ "$INT_RUNS" = "[]" ]; then
            echo "::error::No 'Integration Tests' workflow runs found for commit $TARGET_SHA. Integration tests must run and pass before production migration."
            exit 1
          fi

          INT_IN_PROGRESS=$(echo "$INT_RUNS" | jq '[.[] | select(.status != "completed")] | length')
          if [ "$INT_IN_PROGRESS" -gt 0 ]; then
            echo "::error::'Integration Tests' workflow is currently in progress for commit $TARGET_SHA. Wait for completion."
            exit 1
          fi

          # Pick the latest run
          LATEST_INT_RUN=$(echo "$INT_RUNS" | jq 'sort_by(.createdAt) | reverse | .[0]')
          INT_RUN_ID=$(echo "$LATEST_INT_RUN" | jq -r '.databaseId')
          INT_STATUS=$(echo "$LATEST_INT_RUN" | jq -r '.status')
          INT_CONCLUSION=$(echo "$LATEST_INT_RUN" | jq -r '.conclusion')

          if [ "$INT_STATUS" != "completed" ]; then
            echo "::error::Latest 'Integration Tests' run (ID: $INT_RUN_ID) is not completed (status: $INT_STATUS)."
            exit 1
          fi

          # Query individual jobs inside the latest run
          echo "Inspecting jobs inside Integration Tests run $INT_RUN_ID..."
          INT_JOBS=$(gh run view "$INT_RUN_ID" --json jobs --jq '.jobs')
          E2E_JOB=$(echo "$INT_JOBS" | jq '.[] | select(.name == "HTTP & Concurrency E2E Test Suite")')

          if [ -z "$E2E_JOB" ] || [ "$E2E_JOB" = "null" ]; then
            echo "::error::'HTTP & Concurrency E2E Test Suite' job not found in Integration Tests run $INT_RUN_ID."
            exit 1
          fi

          E2E_STATUS=$(echo "$E2E_JOB" | jq -r '.status')
          E2E_CONCLUSION=$(echo "$E2E_JOB" | jq -r '.conclusion')

          echo "Found 'HTTP & Concurrency E2E Test Suite' job: status='$E2E_STATUS', conclusion='$E2E_CONCLUSION'."

          if [ "$E2E_STATUS" != "completed" ]; then
            echo "::error::'HTTP & Concurrency E2E Test Suite' job is not completed (status: $E2E_STATUS)."
            exit 1
          fi

          if [ "$E2E_CONCLUSION" != "success" ]; then
            if [ "$E2E_CONCLUSION" = "skipped" ]; then
              echo "::error::The 'HTTP & Concurrency E2E Test Suite' job was SKIPPED in run $INT_RUN_ID (TEST_DATABASE_URL was unavailable). Production migration strictly requires actual integration test execution and success."
            else
              echo "::error::The 'HTTP & Concurrency E2E Test Suite' job concluded with '$E2E_CONCLUSION' (run $INT_RUN_ID). Cannot migrate."
            fi
            exit 1
          fi

          echo "Verified: 'HTTP & Concurrency E2E Test Suite' job completed with 'success' for commit $TARGET_SHA (run ID: $INT_RUN_ID)."

  apply-migration:
    name: Apply Drizzle Migrations
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production # Requires human review/approval, ONLY after verify-target passes

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-target.outputs.target_sha }}

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
